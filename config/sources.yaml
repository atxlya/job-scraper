# Company + source registry (docs/companies.md has the evidence for every entry).
# Workday intern facet IDs were read from each site's live `facets` on 2026-11-10.
#
# Adapter config keys:
#   workday:    host, tenant, site, intern_facets {facetParam: [ids]}, intern_search, split_facets
#   eightfold:  host, domain, api (pcsx|apply_v2), filters, incremental_filters
#   oracle_hcm: host, site, public_host
#   google:     queries, incremental_queries (entries may set catch_all: true)
#   barclays:   base, org_id, facets
#   lever:      site                       greenhouse: board
#   amazon:     queries (search.json params)   apple: locale, team
#   amd:        intern_category            capgemini: country_code
#   zerodha:    allow_empty (any source may set it: 0 jobs is then healthy)
#   successfactors: host       rss: url       notice_page: site (drdo|isro|cdac|barc)
#   sitemap_partial: sitemap, job_url (regex with `id` and `slug` groups)
#   atlassian, ibm, phonepe, swiggy, tataelxsi: no keys

companies:
  # ---------------------------------------------------------------- original three
  - slug: google
    name: Google
    sources:
      - key: google-interns
        adapter: google
        config:
          incremental_queries:
            - {target_level: INTERN_AND_APPRENTICE, location: India}
            - {target_level: INTERN_AND_APPRENTICE, catch_all: true}
          queries:
            - {target_level: INTERN_AND_APPRENTICE, location: India}
            - {target_level: INTERN_AND_APPRENTICE, location: United States}
            - {target_level: INTERN_AND_APPRENTICE, location: United Kingdom}
            - {target_level: INTERN_AND_APPRENTICE, location: Ireland}
            - {target_level: INTERN_AND_APPRENTICE, location: Germany}
            - {target_level: INTERN_AND_APPRENTICE, location: Switzerland}
            - {target_level: INTERN_AND_APPRENTICE, location: Poland}
            - {target_level: INTERN_AND_APPRENTICE, location: France}
            - {target_level: INTERN_AND_APPRENTICE, location: Netherlands}
            - {target_level: INTERN_AND_APPRENTICE, location: Israel}
            - {target_level: INTERN_AND_APPRENTICE, location: Japan}
            - {target_level: INTERN_AND_APPRENTICE, location: Singapore}
            - {target_level: INTERN_AND_APPRENTICE, location: Taiwan}
            - {target_level: INTERN_AND_APPRENTICE, location: Australia}
            - {target_level: INTERN_AND_APPRENTICE, location: Canada}
            - {target_level: INTERN_AND_APPRENTICE, location: Brazil}
            - {target_level: INTERN_AND_APPRENTICE, location: Mexico}
            - {target_level: INTERN_AND_APPRENTICE, catch_all: true}

  - slug: nvidia
    name: NVIDIA
    sources:
      - key: nvidia
        adapter: eightfold
        config:
          host: jobs.nvidia.com
