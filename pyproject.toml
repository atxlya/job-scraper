[project]
name = "job-scraper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.3",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "pycountry>=26.2.16",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]  # keep ruff away from code snippets in markdown

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
