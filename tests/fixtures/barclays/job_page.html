<script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","baseSalary":{"@type":"MonetaryAmount","currency":"","value":{"@type":"QuantitativeValue","unitText":""}},"datePosted":"2026-11-10","description":"<p>Join Barclays as Liquidity Risk Reporting – Analyst where the role holder will support wider team with the completion of their reporting and control activities, assisting them with the investigation and resolution of more complex issues. At Barclays, we don&#39;t just anticipate the future - we&#39;re creating it.</p><br /><p>To be successful in this role, you should have:</p><ul><li>Must have good communication skills, both written and verbal, with the ability to work collaboratively with the Reporting teams across the different locations.</li><li>Good presentation skills.</li><li>Very good Microsoft Excel skills.</li><li>Understanding of Balance Sheet and Finance processes.</li><li>Understanding of Control and Governance frameworks.</li><li>CA/CWA/CS/MBA/Finance/Commerce/Economics background.</li></ul><br /><p>Some other highly valued skills may include:</p><ul><li>Experience supporting the roll out of controls frameworks.</li><li>Understanding of Treasury and/or Risk systems in Barclays.</li><li>Reporting work experience in a Bank / Financial Institution.</li></ul><br /><p>You may be assessed on the key critical skills relevant for success in role, such as risk and controls, change and transformation, business acumen strategic thinking and digital and technology, as well as job-specific technical skills.</p><br /><p>This role is based in our Chennai office.</p> <p><b>Purpose of the role</b></p><p>To provide administrative, analytical, and operational support to traders, enabling them to focus on their core responsibilities such as the analysis of markets, execution of trades, and management of risk.  </p><p></p><p><b>Accountabilities</b></p><ul><li>Receive, validate, and process orders from traders, ensuring accuracy and adherence to trading guidelines, and monitoring of order status to communicate updates to traders and counterparties.</li><li>Diagnosis, troubleshooting, and resolution of trading platform issues, connectivity problems, and application errors. Work collaboratively with IT teams to address complex technical issues.</li><li>Support to traders in monitoring and management of market risk, credit risk, and operational risk including the preparation and maintenance of reports on trading risk exposure and compliance with regulatory requirements.</li><li>Management of the bank's trading calendar, ensuring that traders are aware of upcoming market events, economic data releases, and regulatory changes.</li><li>Market research and analysis to identify potential trading opportunities and support traders' trading strategies, and preparation of market reports and presentations for traders and senior colleagues.</li><li>Due diligence on counterparties and verify their trading credentials, and monitoring of trading activity for any potential compliance breaches or suspicious transactions.</li></ul><p></p><p><b>Analyst Expectations</b></p><ul><li>To meet the needs of stakeholders/ customers through specialist advice and support</li><li>Perform prescribed activities in a timely manner and to a high standard which will impact both the role itself and surrounding roles.</li><li>Likely to have responsibility for specific processes within a team</li><li>They may lead and supervise a team, guiding and supporting professional development, allocating work requirements and coordinating team resources. They supervise a team, allocate work requirements and coordinate team resources.</li><li>If the position has leadership responsibilities, People Leaders are expected to demonstrate a clear set of leadership behaviours to create an environment for colleagues to thrive and deliver to a consistently excellent standard. The four LEAD behaviours are: L – Listen and be authentic, E – Energise and inspire, A – Align across the enterprise, D – Develop others.</li><li>OR for an individual contributor,  they manage own workload, take responsibility for the implementation of systems and processes within own work area and participate on projects broader than direct team.</li><li>Execute work requirements as identified in processes and procedures, collaborating with and impacting on the work of closely related teams.</li><li>Check work of colleagues within team to meet internal and stakeholder requirements.</li><li>Provide specialist advice and support pertaining to own work area.</li><li>Take ownership for managing risk and strengthening controls in relation to the work you own or contribute to. Deliver your work and areas of responsibility in line with relevant rules, regulation and codes of conduct.</li><li>Maintain and continually build an understanding of how all teams in area contribute to the objectives of the broader sub-function, delivering impact on the work of collaborating teams.</li><li>Continually develop awareness of the underlying principles and concepts on which the work within the area of responsibility is based, building upon administrative / operational expertise.</li><li>Make judgements based on practise and previous experience.</li><li>Assess the validity and applicability of previous or similar experiences and evaluate options under circumstances that are not covered by procedures.</li><li>Communicate sensitive or difficult information to customers in areas related specifically to customer advice or day to day administrative requirements.</li><li>Build relationships with stakeholders/ customers to identify and address their needs.</li></ul><p></p><p>All colleagues will be expected to demonstrate the Barclays Values of Respect, Integrity, Service, Excellence and Stewardship – our moral compass, helping us do what we believe is right. They will also be expected to demonstrate the Barclays Mindset – to Empower, Challenge and Drive – the operating manual for how we behave.</p>","employmentType":"Permanent","identifier":{"@type":"PropertyValue","name":"Job ID","value":"JR-0000137283"},"industry":"Finance","title":"Liquidity Risk Reporting - Analyst","url":"https://search.jobs.barclays/job/chennai/liquidity-risk-reporting-analyst/13015/102599897824","workHours":"Full time","directApply":false,"hiringOrganization":{"@type":"Organization","name":"Barclays","logo":"https://tbcdn.talentbrew.com/company/13015/v1_0/img/logo/Barclays-Logo-stacked-RGB-Cyan.jpg"},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Chennai","addressRegion":"","addressCountry":"India","streetAddress":"1/124 Shivaji Gardens","postalCode":"600089"}}, {"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Noida","addressRegion":"Uttar Pradesh","addressCountry":"India","streetAddress":"","postalCode":""}}]}</script>
