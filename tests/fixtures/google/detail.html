<script class="ds:0" nonce="ngYmym2-f8D-rBCi8YJWeg">AF_initDataCallback({key: 'ds:0', hash: '1', data:[["125423735539671750","Student Researcher, 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2Fckf-yzLLbht0aZL6r8cTpf6w1-KNAfZL6YS0BxOX9ywjGEjsA9yzvgsd-m8Tf2q3M7E_eIzSzoELRl2oI0nqW2ZDoR4l8COOh620aQZGF6t3tXaqhMWGRhzXLll3lyw%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dStudent+Researcher",[null,"\u003cul\u003e\n\u003cli\u003eParticipate in research to develop solutions for real-world, large-scale problems.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a degree program (e.g., Bachelor's, Master's or PhD) in Computer Science, Linguistics, Statistics, Biostatistics, Applied Mathematics, Operations Research, Economics, or Natural Sciences.\u003c/li\u003e\n\u003cli\u003eExperience in one area of computer science (e.g., Natural Language, Human Computer Interactions, Computer Vision, Machine Learning, Deep Learning, Algorithmic Foundations of Optimization, Quantum Information Science, Data Science, Software Engineering, or a related area).\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a full-time degree program and returning to the program after completion of the internship.\u003c/li\u003e\n\u003cli\u003eExperience as a researcher (e.g., internships, full-time, or at a lab).\u003c/li\u003e\n\u003cli\u003eExperience contributing to research communities or efforts, including publishing papers in major conferences or journals.\u003c/li\u003e\n\u003cli\u003eExperience with one or more general purpose programming languages (e.g., Python, Java, JavaScript, C/C++, etc.).\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["India",["India"],null,null,null,"IN"]],[null,"The Student Researcher Program fosters academic collaborations by hiring students onto research projects aligned to company priorities in scientific advancement. The program offers placements on teams across Google, for research, engineering, and science roles. As a Student Researcher, you will have the opportunity to participate in research projects focused on developing solutions for real-world, large-scale problems.\u003cbr\u003e\u003cbr\u003eStudent Researcher projects are exploratory and direct experiences that drive scientific advancement across a multitude of research areas. Students will work collaboratively on projects that explore innovative research challenges and support the creation of breakthrough technologies.\u003cbr\u003e\u003cbr\u003eThe program is open to students enrolled in a Bachelor’s, Master’s, or PhD program. Projects vary in duration and location based on team and student requirements. It is required that you are located in one of the specific country locations identified for this role for the full duration of the engagement. When you apply, you will be considered for Student Researcher positions across all of Google's research teams including DeepMind, Google Research, Google Cloud and more. This allows us to find the right project match for your skills and interests.\u003cbr\u003e\u003cbr\u003eResearchers across Google are working to advance in computing and build the next generation of intelligent systems for all Google products. To achieve this, we invest in foundational research and work on projects that utilize the latest computer science techniques developed by skilled software developers and research scientists. Whether we're shaping the future of sustainability, optimizing algorithms, or pioneering AI systems, our teams strive to continuously progress science, advance society, and improve the lives of billions of people.\u003cdiv\u003eResearchers across Google are working to advance the stat
