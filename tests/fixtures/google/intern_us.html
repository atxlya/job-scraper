<script class="ds:1" nonce="wqVnc6_BeTTOfdSclzmRYg">AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["121103710599160518","MBA Intern, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckVq5gymvZEIMKp_jyFKrUSW7gakRzYi9XTmL7Eyx12CzEjsA9yzvgoP5vDL2XNcTMsBWBLkWu3qkWZ-GM87UU0E8uWV9Yz9I2cRx3cWVoDf2CCrFSOvvEp3sFJCzjQ%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dMBA+Intern",[null,"\u003cul\u003e\n\u003cli\u003e\u003cp dir\u003d\"ltr\"\u003eGoogle interns are given a lot of responsibility and the opportunity to give a meaningful contribution to their teams. Specific responsibilities are assigned to interns at the start of the program.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a full-time Master of Business Administration program.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e\u003cdiv\u003eIn your first year of an MBA program and returning to a full-time MBA program after completion of the internship with at least one semester remaining in the program.\u003c/div\u003e\u003c/li\u003e\n\u003cli\u003eCurrently attending an MBA program in the US and available to complete a full-time, consecutive 12-week internship between May and September 2027.\u003c/li\u003e\n\u003cli\u003eExcellent project management, people management and organizational skills, with the ability to manage and implement ideas in a changing environment.\u003c/li\u003e\n\u003cli\u003eExcellent problem-solving skills, and ability to solve strategic and difficult business problems.\u003c/li\u003e\n\u003cli\u003eInterest in the technology industry and Google’s business.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eAI Fluency\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["100 Bay Vw Dr, Mountain View, CA 94043, USA"],"Mountain View","94043","CA","US"],["Atlanta, GA, USA",["Atlanta, GA, USA"],"Atlanta",null,"GA","US"],["Austin, TX, USA",["Austin, TX, USA"],"Austin",null,"TX","US"],["Boulder, CO, USA",["Boulder, CO, USA"],"Boulder",null,"CO","US"],["Chicago, IL, USA",["Chicago, IL, USA"],"Chicago",null,"IL","US"],["Kirkland, WA, USA",["Kirkland, WA, USA"],"Kirkland",null,"WA","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["San Bruno, CA, USA",["San Bruno, CA, USA"],"San Bruno",null,"CA","US"],["Seattle, WA, USA",["Seattle, WA, USA"],"Seattle",null,"WA","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"],["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"],["Washington D.C., DC, USA",["Washington, DC, USA"],"Washington",null,"DC","US"]],[null,"\u003cp\u003e*This internship program is intended for students that are pursuing a Master’s in Business Administration in year one of the program, depending on their program and unique circumstances.\u003c/p\u003e\u003cp\u003eOur MBA Internship Program is a paid internship that will immerse you into the tech industry on a high-impact team. You’ll enhance your skill set, be challenged with rigorous work, grow your network and drive meaningful change in our business. \u003c/p\u003e\u003cp\u003eOutside of your core work, you will participate in a high-touch program that exposes you to Google’s business operations, connects you with interns and Googlers, and invests in your personal and professional development. You may pick up a new technical skill, while also building a relationship with a 1:1 mentor and hearing from company leadership through a unique speaker series.\u003c/p\u003e\u003cp\u003eInterns will be considered for potential full-time opportunities in their host organizations based on their internship performance and business need.\u003c/p\u003e\u003cp\u003eRole Areas:\u003c/p\u003e\u003cp\u003eMBA interns are placed on teams across the business according to their background and skills. To explore our primary \u003ca href\u003d\"https://www.google.com/intl/es/about/careers/fields-of-work/\" target\u003d\"_blank\"\u003efields of work\u003c/a\u003e and review common participating teams, please visit our \u003ca href\u003d\"https://rsvp.withgoogle.com/events/google-student-hub/roles\" target\u003d\"_blank\"\u003eStudent Hub page\u003c/a\u003e. While participating hiring teams vary each year, the key role profiles typically included are outlined below: \u003c/p\u003e\u003cp\u003eBusiness Strategy \u0026amp; Operations: Deliver the analytical insights our leaders use to enable us to innovate. Whether it’s identifying acquisitions and investments, generating business strategies for products, or developing partners in emerging markets such as Africa and India, Business Strategy Googlers anticipate opportunities and execute programs critical to Google’s short- and long-term growth.\u003c/p\u003e\u003cp\u003eFinance: Fuel our moonshots by devising innovative solutions to complex problems in forecasting, accounting, compliance, and project management. From advising our product teams to managing day-to-day balance sheets, you’ll help keep our business on track to meet (or, better yet, exceed) our goals.\u003c/p\u003e\u003cp\u003ePeople Operations: Empowering the people who are building the future of AI. Our People Operations team are the strategists and culture-builders who ensure our colleagues can thrive in an AI-powered world. By blending data-driven strategy with a deep focus on the employee experience, we are dedicated to building an extraordinary workplace, designing the future of work, and supporting Google's AI-powered transformation. We’re not just an HR team; we are the architects of the culture that will lead Google's next chapter.\u003c/p\u003e\u003cp\u003eProgram Management: Overseeing day-to-day progress on large-scale projects, owning planning, execution, and communications, Program Managers play a critical role across various product areas and functions across Google, from Cloud to Platform \u0026amp; Devices, and beyond.\u003c/p\u003e\u003cp\u003eProduct Management: You’re a curious and collaborative visionary, someone excited about solving the hard problems in technology. Google is and always will be a company that thinks big and takes risks. Architect the future of our products by bridging engineering and business as you manage a product's full lifecycle, from strategic planning to development and launch. Computer science and coding experience required in order to be considered.\u003c/p\u003e\u003cp\u003eSales, Service \u0026amp; Support: Turn product innovations into vital client solutions. The backbone of Google’s success, the account managers, consultants and analysts in these roles are all dedicated to top-notch client service. Whether negotiating with Fortune 500 companies, solving technical challenges for small businesses, or surfacing product ads in just the right place, we develop new business opportunities while increasing the use of our product offerings.\u003c/p\u003e\u003cp\u003eCorporate Development: You work collaboratively across functions to identify, evaluate, and negotiate both acquisition and strategic investment opportunities. You understand the industry landscape and regional nuances, and provide the management team with the needed insight to drive intelligent, sound decision-making. \u003c/p\u003e\u003cp\u003eGoogle Public Sector: You'll partner with government and education to drive innovation, enhance security, and implement cutting-edge cloud and AI solutions. From enhancing citizen services to protecting national security, you’ll build impactful solutions that make a difference in millions of lives. \u003c/p\u003e\u003cbr\u003e\u003cdiv\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eUS: $96000 - $125000 (USD) + 0% bonus target\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.\u003c/div\u003e\u003cp\u003e\u003cb\u003e\u003c/b\u003e\u003c/p\u003e"],[3],[1791816002,735000000],[1793961782,495000000],[1793961782,999000000],[null,"\u003cp\u003eParticipation in the internship program requires that you are located and have legal authorization to work in the United States for the duration of the internship program. For internship opportunities in the location where you are eligible for summer work authorization, please check google.com/students.\u003c/p\u003e\u003cp\u003ePlease note that applications for this program will be considered for multiple functions based across the United States. After the application period closes, we may reach out to collect additional information regarding your background and skills. You will then have the opportunity to state function preferences.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eApplication: Please complete your application by November 13, 2026\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterviews: Will occur on a rolling basis through Q1 2027\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInternship: 12 consecutive weeks starting in May or June 2027\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eTo start the application process, you will need an updated resume in English (PDFs preferred). Click on the “Apply” button on this page and in the “Resume Section:” attach an updated CV or resume. Please ensure you’ve listed your anticipated graduation date (in MM/YY). \u003c/p\u003e\u003cp\u003eWe will review applications and interview candidates on a rolling basis through Q1 2027. Updates will be provided as the status of applications change in the recruiting process. Candidates will be matched with teams based on their background and skills.\u003c/p\u003e\u003cp\u003eApplicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e\u003cp\u003eIn accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based Interns. Benefits for this role include:\u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHealth, dental, vision insurance\u003c/li\u003e\u003cli\u003eSick Time: Includes 5 discretionary sick days per instance to prioritize your well-being, in addition to all applicable local and state statutory sick leave.\u003c/li\u003e\u003cli\u003eInterns receive paid time off for any official company holidays that fall within their internship term.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eMountain View, CA, USA; Atlanta, GA, USA; Austin, TX, USA; Boulder, CO, USA; Chicago, IL, USA; Kirkland, WA, USA; New York, NY, USA; San Bruno, CA, USA; Seattle, WA, USA; San Francisco, CA, USA; Sunnyvale, CA, USA; Washington D.C., DC, USA\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a full-time Master of Business Administration program.\u003c/li\u003e\n\u003c/ul\u003e"],5],["134577198026629830","Business Data Scientist Intern, PhD, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckfW4n2LKxsfB3XoBjvcmT9GIXwN-T_H6PiKRTjZEvXWQEjsA9yzvgr4hLNeQw47tKJVM05fRzV-JpeOFg3BibjwDRSKsEdFD2kddh8KqNB0FNkRa2vodVXaii_qADw%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dBusiness+Data+Scientist+Intern",[null,"\u003cul\u003e\n\u003cli\u003eWork with large complex data sets, solve difficult non-routine analysis problems, and apply advanced analytical methods. Conduct analysis that includes data gathering and requirements specification, processing, analysis, ongoing deliverables, and presentations.\n\u003c/li\u003e\n\u003cli\u003eBuild and prototype analysis pipelines iteratively to provide insights at scale. Develop a comprehensive understanding of Google data structures and metrics, advocating for changes.\u003c/li\u003e\n\u003cli\u003eInteract cross-functionally, making business recommendations (e.g., cost-benefit, forecasting, experiment analysis) with effective presentations of findings at multiple levels of stakeholders through visual displays of quantitative information.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eDevelop and automate reports, and iteratively build and prototype dashboards to provide insights at scale, solving for business priorities.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eDesign and analyze controlled experiments or counterfactual causal inference studies to examine the incremental impact of business, product, or go-to-market initiatives. \u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently pursuing a PhD degree in a quantitative discipline (e.g., statistics, biostatistics, physics, applied mathematics, operations research, economics).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience with statistical methods (i.e., linear models, multivariate analysis, stochastic processes, sampling methods, etc.).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience with statistical software (e.g., R, Python, MATLAB) and database languages (i.e., SQL).\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently attending a degree program in the US and available to work full time for 12 weeks outside of university term time.\u003c/li\u003e\u003cli\u003eIn their penultimate academic year or returning to a degree program after completion of the internship.\u003c/li\u003e\u003cli\u003eProven track record of research published in ML/AI venues (e.g., NeurIPS, ICML, ICLR, KDD), with a focus on LLMs, generative AI, model evaluations, or related applied machine learning domains.\u003c/li\u003e\u003cli\u003eHands-on experience designing, training, and optimizing deep learning models, with prior research or internship experience applying ML/LLMs to real-world business challenges (e.g., recommendation systems, revenue forecasting, or agent development).\u003c/li\u003e\u003cli\u003ePractical experience parsing, cleaning, and extracting structured insights from messy, unstructured text data (e.g., conversational transcripts, emails) and utilizing modern AI coding tools and agentic workflows (e.g., Cursor, Codex, Claude Code).\u003c/li\u003e\u003cli\u003ePractical experience with time-series forecasting, standard econometric models, and analyzing experimental data using both frequentist and Bayesian statistical techniques.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["Google BVG4, 400 Bay Vw Dr, Mountain View, CA 94035, USA"],"Mountain View","94035","CA","US"],["Ann Arbor, MI, USA",["Ann Arbor, MI, USA"],"Ann Arbor",null,"MI","US"],["Atlanta, GA, USA",["Atlanta, GA, USA"],"Atlanta",null,"GA","US"],["Austin, TX, USA",["Austin, TX, USA"],"Austin",null,"TX","US"],["Boulder, CO, USA",["Boulder, CO, USA"],"Boulder",null,"CO","US"],["Bellevue, WA, USA",["Bellevue, WA, USA"],"Bellevue",null,"WA","US"],["Cambridge, MA, USA",["Cambridge, MA, USA"],"Cambridge",null,"MA","US"],["Chicago, IL, USA",["Chicago, IL, USA"],"Chicago",null,"IL","US"],["Irvine, CA, USA",["Irvine, CA, USA"],"Irvine",null,"CA","US"],["Kirkland, WA, USA",["Kirkland, WA, USA"],"Kirkland",null,"WA","US"],["Los Angeles, CA, USA",["Los Angeles, CA, USA"],"Los Angeles",null,"CA","US"],["Madison, WI, USA",["Madison, WI, USA"],"Madison",null,"WI","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["Palo Alto, CA, USA",["Palo Alto, CA, USA"],"Palo Alto",null,"CA","US"],["Portland, OR, USA",["Portland, OR, USA"],"Portland",null,"OR","US"],["Pittsburgh, PA, USA",["Pittsburgh, PA, USA"],"Pittsburgh",null,"PA","US"],["Raleigh, NC, USA",["Raleigh, NC, USA"],"Raleigh",null,"NC","US"],["Durham, NC, USA",["Durham, NC, USA"],"Durham",null,"NC","US"],["Reston, VA, USA",["Reston, VA, USA"],"Reston",null,"VA","US"],["Redmond, WA, USA",["Redmond, WA, USA"],"Redmond",null,"WA","US"],["Redwood City, CA, USA",["Redwood City, CA, USA"],"Redwood City",null,"CA","US"],["San Diego, CA, USA",["San Diego, CA, USA"],"San Diego",null,"CA","US"],["Goleta, CA, USA",["Goleta, CA, USA"],"Goleta",null,"CA","US"],["San Bruno, CA, USA",["San Bruno, CA, USA"],"San Bruno",null,"CA","US"],["Seattle, WA, USA",["Seattle, WA, USA"],"Seattle",null,"WA","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"],["San José, CA, USA",["San Jose, CA, USA"],"San Jose",null,"CA","US"],["Santa Cruz, CA, USA",["Santa Cruz, CA, USA"],"Santa Cruz",null,"CA","US"],["South San Francisco, CA, USA",["South San Francisco, CA, USA"],"South San Francisco",null,"CA","US"],["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"],["Washington D.C., DC, USA",["Washington, DC, USA"],"Washington",null,"DC","US"]],[null,"\u003cp\u003eAs a Business Data Scientist, you will be a subject matter specialist for translating business problems from your supported organization or functional area into analytical solutions and insights. You will provide technical mentorship in delivering project work including implementing data science solutions, improving data pipelines, developing evaluation metrics, or building statistical models that provide insights to the business. You will create and implement reused and scaled solutions within the team's development process. You will collaborate with supported teams and win stakeholder trust by translating business needs into tractable analyses or evaluation metrics. You will work closely with product and engineering teams to analyze impact on product or Google-wide metrics (including daily activities, retention, churn).\u003c/p\u003e\u003cp\u003eGoogle is and always will be an engineering company. We hire people with a broad set of technical skills who are ready to address some of technology's greatest challenges and make an impact on millions, if not billions, of users. At Google, engineers not only revolutionize search, they routinely work on massive scalability and storage solutions, large-scale applications and entirely new platforms for developers around the world. From Google Ads to Chrome, Android to YouTube, Social to Local, Google engineers are changing the world one technological achievement after another.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eUS: $118000 - $157000 (USD) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.\u003c/p\u003e"],[4],[1789391904,544000000],[1793189321,525000000],[1793189322,137000000],[null,"\u003cp\u003ePlease complete your application before\u003cb\u003e February 26, 2027.\u003c/b\u003e\u003c/p\u003e\u003cp\u003eApplications will be reviewed on a rolling basis and it’s in a candidate’s best interest to apply early.\u003c/p\u003e\u003cp\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about your application, we likely proceeded with other candidates for the role. \u003c/p\u003e\u003cp\u003eParticipation in the internship program requires that you are located in the United States for the duration of the internship program.\u003c/p\u003e\u003cp\u003eThis internship is intended for students in their penultimate academic year, who are pursuing a PhD degree program in a quantitative discipline (e.g., statistics, biostatistics, physics, applied mathematics, operations research, economics).\u003c/p\u003e\u003cp\u003eGoogle is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.\u003cbr\u003e\u003cbr\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003c/p\u003e\u003col\u003e\u003cli\u003eIn the “Resume Section:” attach an updated CV or resume.\u003c/li\u003e\u003cul\u003e\u003cli\u003e\u003cb\u003ePlease ensure you’ve listed your anticipated graduation date (in MM/YY)\u003c/b\u003e\u003c/li\u003e\u003c/ul\u003e\u003cli\u003eIn the “Education Section:” attach a current or recent unofficial or official transcript in English.\u003c/li\u003e\u003cul\u003e\u003cli\u003eUnder “Degree Status,” select “Now attending” to upload a transcript.\u003c/li\u003e\u003c/ul\u003e\u003c/ol\u003e\u003cdiv\u003eIn accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based Interns. Benefits for this role include: \u003cbr\u003e\u003cul\u003e\u003cli\u003eHealth, dental, vision insurance\u003c/li\u003e\u003cli\u003eSick Time: 40 hours/year (increased to 69 hours/year for Seattle) including 5 discretionary sick days per instance \u003c/li\u003e\u003cli\u003eHolidays: 13 paid days per year\u003c/li\u003e\u003c/ul\u003e\u003cdiv\u003e\u003cp\u003eThis role may also be located in our Playa Vista, CA campus.\u003c/p\u003e\u003cp\u003eApplicants in the County of Los Angeles: Qualified applications with arrest or conviction records will be considered for employment in accordance with the Los Angeles County Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e\u003cp\u003eApplicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eMountain View, CA, USA; Ann Arbor, MI, USA; Atlanta, GA, USA; Austin, TX, USA; Boulder, CO, USA; Bellevue, WA, USA; Cambridge, MA, USA; Chicago, IL, USA; Irvine, CA, USA; Kirkland, WA, USA; Los Angeles, CA, USA; Madison, WI, USA; New York, NY, USA; Palo Alto, CA, USA; Portland, OR, USA; Pittsburgh, PA, USA; Raleigh, NC, USA; Durham, NC, USA; Reston, VA, USA; Redmond, WA, USA; Redwood City, CA, USA; San Diego, CA, USA; Goleta, CA, USA; San Bruno, CA, USA; Seattle, WA, USA; San Francisco, CA, USA; San José, CA, USA; Santa Cruz, CA, USA; South San Francisco, CA, USA; Sunnyvale, CA, USA; Washington D.C., DC, USA\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eCurrently pursuing a PhD degree in a quantitative discipline (e.g., statistics, biostatistics, physics, applied mathematics, operations research, economics).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience with statistical methods (i.e., linear models, multivariate analysis, stochastic processes, sampling methods, etc.).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience with statistical software (e.g., R, Python, MATLAB) and database languages (i.e., SQL).\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],5],["75665705386549958","Forward Deployed Engineering Intern, BS/MS, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckdHNyVrUDsG2vzWbonlxJ4qJp5Tn7QulwQAnbz3guzZzEjsA9yzvggJJdX3902IKPhOzN_Fv7epBt5gfXJAtAo4SeEVgG5uX1WjX9omfsUgTTxdJgXMK26IKtUjEmA%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dForward+Deployed+Engineering+Intern",[null,"\u003cul\u003e\n\u003cli\u003eServe as a developer for complex AI applications, transitioning from rapid prototypes to production-grade agentic workflows (e.g., multi-agent systems, MCP servers) that drive measurable ROI.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eArchitect and code the connective tissue between Google’s AI products and customer's live infrastructure, including APIs, legacy data silos, and security perimeters as part of an expert team.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eBuild high-performance evaluation pipelines and observability frameworks to ensure agentic systems meet rigorous requirements for accuracy, safety, and latency.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eIdentify repeatable field patterns and friction points in Google’s AI stack, converting them into reusable modules or formal product feature requests for the Engineering teams.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eCo-build with customer engineering teams to instill Google-grade development best practices, ensuring long-term project success and high end-user adoption.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently pursuing a Bachelor's or Master's degree in Engineering, Computer Science, or a related technical field.\u003c/li\u003e\n\u003cli\u003eExperience with software development using Python or a similar coding languages.\u003c/li\u003e\n\u003cli\u003eExperience taking production-grade AI-driven solutions from conception to launch and architecting AI systems on cloud platforms (e.g., Google Cloud Platform (GCP)).\u003c/li\u003e\n\u003cli\u003eExperience building pipelines for structured and unstructured data using both vector databases and RAG-like architectures to power enterprise AI solutions.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently attending a degree program in the US and available to work full time for 12 weeks outside of university term time.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eIn their penultimate academic year or returning to a degree program after completion of the internship.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience implementing multi-agent systems using frameworks (e.g., LangGraph, CrewAI, ADK) and complex patterns (e.g., ReAct, self-reflection, hierarchical delegation).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience leading technical discovery sessions.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eKnowledge of Large Language Model (LLM) native metrics (e.g., tokens/sec, cost-per-request) and techniques for optimizing state management and granular tracing.\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Sunnyvale, CA, USA",["Google Building MP1, 1155 Borregas Ave building 1, Sunnyvale, CA 94089, USA"],"Sunnyvale","94089","CA","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["Reston, VA, USA",["Reston, VA, USA"],"Reston",null,"VA","US"]],[null,"\u003cp\u003eIt’s an exciting time to join our Google Cloud Consulting team, leading the AI and cloud revolution for businesses worldwide. In this role, you’ll work hand-in-hand with our customers as an embedded builder, bridging the gap between frontier AI products and production-grade reality. We are looking for early-career, high-agency engineers with a founder’s mindset. Moving beyond high-level architecture, you will code, debug, and jointly ship bespoke agentic solutions directly within customer environments while helping solve integration, data readiness, and state-management challenges. Joining a collaborative culture with direct access to Google's engineering minds, you will act as an innovator-builder, providing white-glove deployment of complex AI systems and serving as a critical feedback loop to shape Google Cloud’s future product roadmap.\u003c/p\u003e\u003cp\u003eGoogle is and always will be an engineering company. We hire people with a broad set of technical skills who are ready to address some of technology's greatest challenges and make an impact on millions, if not billions, of users. At Google, engineers not only revolutionize search, they routinely work on massive scalability and storage solutions, large-scale applications and entirely new platforms for developers around the world. From Google Ads to Chrome, Android to YouTube, Social to Local, Google engineers are changing the world one technological achievement after another.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eUS: $98000 - $131000 (USD) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.  \u003c/p\u003e"],[2,3],[1791796170,275000000],[1792586374,915000000],[1792586374,982000000],[null,"\u003cp\u003e\u003cb\u003ePlease complete your application before November 20\u003c/b\u003e\u003cb\u003e, 2026. \u003c/b\u003e\u003c/p\u003e\u003cdiv\u003eApplications will be reviewed on a rolling basis and it’s in an applicant's best interest to apply early.\u003cp\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about your application, we likely proceeded with other candidates for the role.\u003c/p\u003e\u003cp\u003eParticipation in the internship program requires that you are located in the United States for the duration of the internship program.\u003c/p\u003e\u003cp\u003eThis internship is intended for students in their penultimate academic year, who are pursuing a Bachelor's or Master's degree in Engineering, Computer Science, a related technical field.\u003c/p\u003e\u003cp\u003eGoogle is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.\u003cbr\u003e\u003c/p\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003col\u003e\u003cli\u003eIn the “Resume Section:” attach an updated CV or resume.\u003c/li\u003e\u003cli\u003eIn the “Education Section:” attach a current or recent unofficial or official transcript in English.\u003c/li\u003e\u003cul\u003e\u003cli\u003eUnder “Degree Status,” select “Now attending” to upload a transcript.\u003c/li\u003e\u003c/ul\u003e\u003c/ol\u003e\u003c/div\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eSunnyvale, CA, USA; New York, NY, USA; Reston, VA, USA\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eCurrently pursuing a Bachelor's or Master's degree in Engineering, Computer Science, or a related technical field.\u003c/li\u003e\n\u003cli\u003eExperience with software development using Python or a similar coding languages.\u003c/li\u003e\n\u003cli\u003eExperience taking production-grade AI-driven solutions from conception to launch and architecting AI systems on cloud platforms (e.g., Google Cloud Platform (GCP)).\u003c/li\u003e\n\u003cli\u003eExperience building pipelines for structured and unstructured data using both vector databases and RAG-like architectures to power enterprise AI solutions.\u003c/li\u003e\n\u003c/ul\u003e"],5],["81809776362562246","People Analytics Intern, PhD, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckXqFbRPL4wiWN5fgl2aKyyC8kY0owlGayucD4p-9Mdu2EjsA9yzvgvV2hNK6YfknTe9KsiqA7uMW6QiONgEcFlwm779fCkHGmhyiaAlMes8vESbUAv2kwJTUbInJkQ%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dPeople+Analytics+Intern",[null,"\u003cul\u003e\n\u003cli\u003eWork with the People Analytics team to design and implement new studies, analyze data and report on results of research initiatives to a business audience.\u003c/li\u003e\n\u003cli\u003eCommunicate findings and recommendations to influence leaders to take action on the results.\n\u003c/li\u003e\n\u003cli\u003eWrite research briefs.\n\u003c/li\u003e\n\u003cli\u003eConduct statistical analysis (e.g., correlation, regression, factor analysis, T-test, ANOVA) using survey and archival data with analyses conducted in R.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a PhD program in Industrial/Organizational Psychology, Organizational Behavior, Personality Psychology, Social Psychology or a related field.\u003c/li\u003e\n\u003cli\u003eExperience designing, developing, and conducting survey or experimental research.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience analyzing and manipulating data in R, Python, SQL, or other statistical programming languages.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently attending a degree program in the US and available to work full time for 12 weeks outside of university term time.\u003c/li\u003e\n\u003cli\u003eExperience conducting applied research in organizations.\n\u003c/li\u003e\n\u003cli\u003eTopical experience in one of the following areas: performance management, individual and team-level performance and productivity, individual differences (e.g., personality traits, behaviors, well-being), selection and assessment (including relevant psychometric methods), decision science and behavior change, or quantitative text analysis.\u003c/li\u003e\n\u003cli\u003eExperience using R for statistical analysis and data visualization.\n\u003c/li\u003e\n\u003cli\u003eExperience in SQL or other scripting languages and experience with future-proofing code to be long-lasting (e.g., detailed documentation).\u003c/li\u003e\n\u003cli\u003eExperience with statistical analyses, including fundamentals (e.g., ANOVAs or regressions) and with one or more advanced approaches (e.g., factor analysis, network analysis, HLM, SEM).\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["100 Bay Vw Dr, Mountain View, CA 94043, USA"],"Mountain View","94043","CA","US"],["Atlanta, GA, USA",["Atlanta, GA, USA"],"Atlanta",null,"GA","US"],["Chicago, IL, USA",["Chicago, IL, USA"],"Chicago",null,"IL","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"]],[null,"\u003cp\u003eWe are a group of social scientists who conduct experimental, survey, and archival research to inform people-related business decisions. Example content areas include, but are not limited to: decision making, leadership, employee well-being, hiring, performance management, performance development, personality, longitudinal data analyses, and social networks. We have strong research backgrounds, with PhDs in I/O Psychology, Organizational Behavior (micro \u0026amp; macro), Sociology, Social Psychology, Anthropology, Behavioral Economics, and related fields. \u003c/p\u003e\nIndividual pay is de  not billions, of users. At Google, engineers not only revolutionize search, they routinely work on massive scalability and storage solutions, large-scale applications and entirely new platforms for developers around the world. From Google Ads to Chrome, Android to YouTube, Social to Local, Google engineers are changing the world one technological achievement after another.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eUS: $106000 - $141000 (USD) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.\u003c/p\u003e"],[4],[1789391905,1000000],[1789544306,726000000],[1789544306,845000000],[null,"\u003cb\u003ePlease complete your application before February 26th, 2027.\u003c/b\u003e\u003cbr\u003e\u003cp\u003eApplications will be reviewed on a rolling basis and it’s in a candidate’s best interest to apply early.\u003c/p\u003e\u003cp\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about your application, we likely proceeded with other candidates for the role. \u003c/p\u003e\u003cp\u003eParticipation in the internship program requires that you are located in the United States for the duration of the internship program.\u003c/p\u003e\u003cp\u003eThis internship is intended for students in their penultimate academic year, who are pursuing a PhD degree in Electrical Engineering, Mechanical Engineering, Computer Engineering, Computer Science, or a related technical field.\u003c/p\u003e\u003cp\u003eGoogle is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.\u003cbr\u003e\u003c/p\u003eTo start the application process, you Tcl, Perl, or C++.\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently attending a degree program in the US and available to work full time for 12 weeks outside of university terms, and also in penultimate academic year or returning to a degree program after completion of the internship.\u003c/li\u003e\n\u003cli\u003eResearch experience in specialized areas such as high-performance/low-power architectures, domain-specific accelerators (DSAs/TPUs), memory hierarchies, coherent interconnects (e.g., CXL, PCIe, UCIe, NoC), or advanced packaging/chiplets.\u003c/li\u003e\n\u003cli\u003eExperience developing and maintaining CAD/EDA design flows, methodology infrastructure, or applying ML for chip design automation.\u003c/li\u003e\n\u003cli\u003eUnderstanding of advanced ML/DL model architectures (e.g., Transformers, LLMs) with experience in performance modeling, cycle-accurate simulation, or custom AI accelerator evaluation.\u003c/li\u003e\n\u003cli\u003eFamiliarity with industry-standard EDA tools (e.g., from Synopsys, Cadence, Siemens EDA, or emulation/formal platforms).\u003c/li\u003e\n\u003cli\u003eDemonstrated research track record and ability to work on complex, open-ended problems, with publications in conferences (e.g., ISCA, MICRO, HPCA, ASPLOS, DAC, ICCAD, ISSCC, NeurIPS, MLSys).\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"],["Austin, TX, USA",["Austin, TX, USA"],"Austin",null,"TX","US"],["Madison, WI, USA",["Madison, WI, USA"],"Madison",null,"WI","US"]],[null,"\u003cp\u003eThe Google Cloud and AI Infrastructure team focuses on building Google's next-generation systems. The team's work is grounded in creating custom hardware, and as an intern you'll get to collaborate with engineers from various parts of the organization to influence the future of Google Cloud and the AI infrastructure by working on the foundational technology that makes it all possible. This is the hardware that powers everything from Google Cloud, to our most advanced models like Gemini.\u003c/p\u003e\u003cp\u003eAs an intern, you will work on fundamental problems at the intersection of hardware, software, and algorithms. You will collaborate with exceptional engineers and researchers on projects that directly impact Google's custom silicon portfolio, including highly specialized AI accelerators like our Tensor Processing Units (TPUs), and complex Systems-on-a-Chip (SoCs). Your responsibilities and projects will be tailored to your expertise and could focus on any part of the system stack.\u003c/p\u003e\u003cp\u003eGoogle Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.\u003c/p\u003e\u003cp\u003eGoogle is and always will be an engineering company. We hire people with a broad set of technical skills who are ready to address some of technology's greatest challenges and make an impact on millions, if not billions, of users. At Google, engineers not only revolutionize search, they routinely work on massive scalability and storage solutions, large-scale applications and entirely new platforms for developers around the world. From Google Ads to Chrome, Android to YouTube, Social to Local, Google engineers are changing the world one technological achievement after another.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e urrent or recent unofficial or official transcript in English.\u003c/li\u003e\u003cul\u003e\u003cli\u003eUnder “Degree Status,” select “Now attending” to upload a transcript.\u003c/li\u003e\u003c/ul\u003e\u003c/ol\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eSunnyvale, CA, USA; Austin, TX, USA; Madison, WI, USA\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eCurrently pursuing a PhD degree in Electrical Engineering, Computer Engineering, Computer Science, or a related technical field.\u003c/li\u003e\n\u003cli\u003eProject or coursework experience in any one of the silicon engineering areas: architecture and RTL, verification and validation, physical design and circuits, systems, test and CAD.\u003c/li\u003e\n\u003cli\u003eExperience with scripting and programming languages such as Python, Tcl, Perl, or C++.\u003c/li\u003e\n\u003c/ul\u003e"],5],["89965613241246406","Data Scientist, Research Intern, PhD, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckfDLtu-DWZIq4WBzr28dvKFXdL45QqsiteUKMyKqbrMDEjsA9yzvgjz5bKWzMy5eoRRtk0_PLK31nNMVb0LAiXFuJb1nG0QG0Mau9u0EMlnQIlyvQFmrIl_2BcdyQA%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dData+Scientist",[null,"\u003cul\u003e\n\u003cli\u003eWork with large complex data sets, solve difficult non-routine analysis problems, and apply advanced analytical methods. Conduct analysis that includes data gathering and requirements specification, processing, analysis, ongoing deliverables, and presentations.\n\u003c/li\u003e\n\u003cli\u003eBuild and prototype analysis pipelines iteratively to provide insights at scale. Develop a comprehensive understanding of Google data structures and metrics, advocating for changes.\n\u003c/li\u003e\n\u003cli\u003eInteract cross-functionally with a wide variety of people and teams. Work closely with engineers to identify opportunities, design and assess improvements to Google products.\n\u003c/li\u003e\n\u003cli\u003eMake business recommendations (e.g., cost-benefit, forecasting, experiment analysis) with effective presentations of findings at multiple levels of stakeholders through visual displays of quantitative information.\n\u003c/li\u003e\n\u003cli\u003eResearch and develop analysis, forecasting, and optimization methods to improve the quality of Google's user products.\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently pursuing a PhD degree in a quantitative discipline (e.g., statistics, biostatistics, physics, applied mathematics, operations research, economics).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience with statistical methods (linear models, multivariate analysis, stochastic processes, sampling methods, etc.).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience with data analysis.\n\u003c/li\u003e\n\u003cli\u003eExperience using R or Python and technology to work with datasets such as scripting or statistical software (R, SAS, etc.).\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently attending a degree program in the US and available to work full time for 12 weeks outside of university term time.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eIn their penultimate academic year or returning to a degree program after completion of the internship.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eAbility to draw conclusions from data and recommend actions.\n\u003c/li\u003e\n\u003cli\u003eAbility to take on a leadership role and take initiative. \u003cbr\u003e\u003c/li\u003e\n\u003cli\u003e\u003cdiv\u003eInterest in learning new techniques.\u003cbr\u003e\u003c/div\u003e\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591 m after completion of the internship.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eCurrently attending a degree program in the United States.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience as a researcher, including internships, full-time, or at a lab.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience contributing to research communities or efforts, including publishing papers in major conferences or journals.\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience with one or more general purpose programming languages (e.g., Python, Java, JavaScript, C/C++, etc.).\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["NASA Ames Building N-255, 100 Bay Vw Dr, Mountain View, CA 94043, USA"],"Mountain View","94043","CA","US"],["Ann Arbor, MI, USA",["Ann Arbor, MI, USA"],"Ann Arbor",null,"MI","US"],["Atlanta, GA, USA",["Atlanta, GA, USA"],"Atlanta",null,"GA","US"],["Austin, TX, USA",["Austin, TX, USA"],"Austin",null,"TX","US"],["Boulder, CO, USA",["Boulder, CO, USA"],"Boulder",null,"CO","US"],["Cambridge, MA, USA",["Cambridge, MA, USA"],"Cambridge",null,"MA","US"],["Chicago, IL, USA",["Chicago, IL, USA"],"Chicago",null,"IL","US"],["Houston, TX, USA",["Houston, TX, USA"],"Houston",null,"TX","US"],["Irvine, CA, USA",["Irvine, CA, USA"],"Irvine",null,"CA","US"],["Kirkland, WA, USA",["Kirkland, WA, USA"],"Kirkland",null,"WA","US"],["Los Angeles, CA, USA",["Los Angeles, CA, USA"],"Los Angeles",null,"CA","US"],["Madison, WI, USA",["Madison, WI, USA"],"Madison",null,"WI","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["Palo Alto, CA, USA",["Palo Alto, CA, USA"],"Palo Alto",null,"CA","US"],["Princeton, NJ, USA",["Princeton, NJ, USA"],"Princeton",null,"NJ","US"],["Pittsburgh, PA, USA",["Pittsburgh, PA, USA"],"Pittsburgh",null,"PA","US"],["Raleigh, NC, USA",["Raleigh, NC, USA"],"Raleigh",null,"NC","US"],["Durham, NC, USA",["Durham, NC, USA"],"Durham",null,"NC","US"],["Goleta, CA, USA",["Goleta, CA, USA"],"Goleta",null,"CA","US"],["San Bruno, CA, USA",["San Bruno, CA, USA"],"San Bruno",null,"CA","US"],["Seattle, WA, USA",["Seattle, WA, USA"],"Seattle",null,"WA","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"],["San Jose, CA, USA",["San Jose, CA, USA"],"San Jose",null,"CA","US"],["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"],["Washington D.C., DC, USA",["Washington, DC, USA"],"Washington",null,"DC","US"]],[null,"\u003cp\u003eIn accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based Interns. Benefits for this role include:\u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHealth, dental, vision insurance\u003c/li\u003e\u003cli\u003eSick Time: 40 hours/year (increased to 69 hours/year for Seattle) including 5 discretionary sick days per instance\u003c/li\u003e\u003cli\u003eHolidays: 13 paid days per year\u003c/li\u003e\u003c/ul\u003e\u003cdiv\u003e\u003c/div\u003e\u003cp\u003eThis role may also be located in our Playa Vista, CA campus.\u003c/p\u003e\u003cp\u003eApplicants in the County of Los Angeles: Qualified applications with arrest or conviction records will be considered for employment in accordance with the Los Angeles County Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e\u003cp\u003eApplicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e\u003cp\u003e---\u003c/p\u003e\u003cp\u003eThe Student Researcher Program fosters academic collaborations by hiring students onto research projects aligned to company priorities in scientific advancement. The program offers placements on teams across Google, for research, engineering, and science roles. As a Student Researcher, you will have the opportunity to participate in research projects focused on developing solutions for real-world, large-scale problems.\u003c/p\u003e\u003cp\u003eStudent Researcher projects are exploratory and experiences that drive scientific advancement across a multitude of research areas. Students will work collaboratively on projects that explore innovative research challenges and support the creation of breakthrough technologies.\u003c/p\u003e\u003cp\u003eProjects vary in duration and location based on team and student requirements. It is required that you are located in one of the specific country locations identified for this role for the full duration of the engagement. When you apply, you will be considered for Student Researcher positions across all of Google's research teams including DeepMind, Google Research, Google Cloud and more. This allows us to find the right project match for your skills and interests.\u003c/p\u003e\u003cp\u003eResearchers across Google are working to advance the state of the art in computing and build the next generation of intelligent systems for all Google products. To achieve this, we invest in foundational research and work on projects that utilize the latest computer science techniques developed by skilled software developers and research scientists. Whether we're shaping the future of sustainability, optimizing algorithms, or pioneering AI systems, our teams strive to continuously progress science, advance society, and improve the lives of billions of people.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eUS: $118000 - $157000 (USD) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.\u003c/p\u003e\u003cb\u003e\u003c/b\u003e"],[4],[1789391904,159000000],[1789391904,159000000],[1789391904,265000000],[null,"\u003cp\u003eApplications are reviewed on a rolling basis; we encourage early submission. The anticipated application window is open until \u003cb\u003eJuly 16, 2027\u003c/b\u003e, but may close earlier if all available projects are full.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eThis application is intended for candidates who will be enrolled in a PhD degree program at the time of the engagement and have a demonstrated research focus.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUnlike the Research Internship, which is a structured seasonal placement, the Student Researcher role offers greater flexibility in weekly time commitment, project duration, and onsite/remote options. Specific work arrangements and engagement timelines are confirmed during the offer stage.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThis program is intended for students who will continue their academic studies. Participation in this program does not guarantee automatic full-time hiring consideration. Individuals interested in pursuing a full-time role at Google following their Student Researcher engagement are encouraged to apply through standard external hiring channels.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eParticipation in this program requires that you are located in the United States for the duration of the engagement, though select remote arrangements from within the United States or Canada may be permitted depending on project requirements. Candidates residing in other countries must relocate to the United States for the engagement.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBecause projects are approved on an ongoing basis throughout the application cycle, application review takes place continuously and may take several months. You will be contacted directly if your a areas).\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],5],["117572151191446214","User Experience Engineer Intern, PhD, Summer 2027","https://www.google.com/about/careers/applications/signin?jobId\u003dCiUAL2FckSKIdCpFRmMvdUf5c2qNANdMspc68tGwJmN0g6KYVQchEjsA9yzvgnlFRcytaSDUTzDa40lo6uZiMXtA1ZIfvuaHuPAoNi7aWOlChGDBD8Doh1SrcuZPSNlyyei8Hw%3D%3D_V2\u0026loc\u003dUS\u0026title\u003dUser+Experience+Engineer+Intern",[null,"\u003cul\u003e\n\u003cli\u003eWork closely with UX designers, project managers and back-end engineers to implement versatile front-end solutions to web development issues.\n\u003c/li\u003e\n\u003cli\u003eLaunch, iterate and make a difference. Provide front-end coding expertise, and help make our products better for users.\n\u003c/li\u003e\n\u003cli\u003eManage your own time, and work well both independently and as part of a team.\n\u003c/li\u003e\n\u003cli\u003eDesign, architect, and implement high-fidelity interactive prototypes exploring novel interface paradigms (e.g., multimodal AI, conversational/agentic systems, adaptive UIs).\u003c/li\u003e\n\u003c/ul\u003e"],[null,"\u003ch3\u003eMinimum qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently pursuing a PhD degree in Computer Science, HCI, Design, or related technical field.\u003c/li\u003e\n\u003cli\u003eExperience with JavaScript, HTML, and CSS.\n\u003c/li\u003e\n\u003cli\u003eExperience in designing and implementing user interfaces (UIs).\n\u003c/li\u003e\n\u003c/ul\u003e\u003cbr\u003e\u003ch3\u003ePreferred qualifications:\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003eCurrently attending a degree program in the US and available to work full time for 12 weeks outside of university term.\u003c/li\u003e\n\u003cli\u003eIn penultimate academic year or returning to a degree program after completion of the internship.\u003c/li\u003e\n\u003cli\u003eExperience with modern frontend frameworks and libraries (e.g., React, TypeScript, Angular, Vue, etc.).\u003cbr\u003e\u003c/li\u003e\n\u003cli\u003eExperience developing high-fidelity interactive prototypes, multimodal AI interfaces, or novel interaction models.\u003c/li\u003e\n\u003cli\u003eExperience coding in Python, TypeScript, Go, C++, Java, Swift, or Kotlin.\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["NASA Ames Building N-255, 100 Bay Vw Dr, Mountain View, CA 94043, USA"],"Mountain View","94043","CA","US"],["Atlanta, GA, USA",["Atlanta, GA, USA"],"Atlanta",null,"GA","US"],["Austin, TX, USA",["Austin, TX, USA"],"Austin",null,"TX","US"],["Boulder, CO, USA",["Boulder, CO, USA"],"Boulder",null,"CO","US"],["Bellevue, WA, USA",["Bellevue, WA, USA"],"Bellevue",null,"WA","US"],["Cambridge, MA, USA",["Cambridge, MA, USA"],"Cambridge",null,"MA","US"],["Chicago, IL, USA",["Chicago, IL, USA"],"Chicago",null,"IL","US"],["Irvine, CA, USA",["Irvine, CA, USA"],"Irvine",null,"CA","US"],["Kirkland, WA, USA",["Kirkland, WA, USA"],"Kirkland",null,"WA","US"],["Los Angeles, CA, USA",["Los Angeles, CA, USA"],"Los Angeles",null,"CA","US"],["Madison, WI, USA",["Madison, WI, USA"],"Madison",null,"WI","US"],["New York, NY, USA",["New York, NY, USA"],"New York",null,"NY","US"],["Palo Alto, CA, USA",["Palo Alto, CA, USA"],"Palo Alto",null,"CA","US"],["Pittsburgh, PA, USA",["Pittsburgh, PA, USA"],"Pittsburgh",null,"PA","US"],["Reston, VA, USA",["Reston, VA, USA"],"Reston",null,"VA","US"],["Redmond, WA, USA",["Redmond, WA, USA"],"Redmond",null,"WA","US"],["San Diego, CA, USA",["San Diego, CA, USA"],"San Diego",null,"CA","US"],["Goleta, CA, USA",["Goleta, CA, USA"],"Goleta",null,"CA","US"],["San Bruno, CA, USA",["San Bruno, CA, USA"],"San Bruno",null,"CA","US"],["Seattle, WA, USA",["Seattle, WA, USA"],"Seattle",null,"WA","US"],["San Francisco, CA, USA",["San Francisco, CA, USA"],"San Francisco",null,"CA","US"],["Santa Cruz, CA, USA",["Santa Cruz, CA, USA"],"Santa Cruz",null,"CA","US"],["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"],["Washington D.C., DC, USA",["Washington, DC, USA"],"Washington",null,"DC","US"],["Portland, OR, USA",["Portland, OR, USA"],"Portland",null,"OR","US"]],[null,"\u003cp\u003eGoogle User Experience (UX) is made up of multi-disciplinary teams of UX Designers, Researchers, Writers, Content Strategists, Program Managers, and Engineers: we care deeply about the people who use our products. The UX team plays an integral part in gathering insights about the attitudes, emotions, and behaviors of people who use our products to inspire and inform design. We collaborate closely with each other and with engineering and product management to create industry-leading products that deliver value for the people who use them, and for Google’s businesses.\u003c/p\u003eAs a UX Engineer, you'll work on the front end of our products in a challenging, fast-paced environment, helping to bridge UX best practices and production execution. You’ll demonstrate your creativity, analytical skills, and knowledge of user facing technologies to enable efficient, high quality execution and communications and launch innovative features to a global audience.\n\u003cp\u003eGoogle is and always will be an engineering company. We hire people with a broad set of technical skills who are ready to address some of technology's greatest challenges and make an impact on millions, if not billions, of users. At Google, engineers not only revolutionize search, they routinely work on massive scalability and storage solutions, large-scale applications and entirely new platforms for developers around the world. From Google Ads to Chrome, Android to YouTube, Social to Local, Google engineers are changing the world one technological achievement after another.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eUS: $106000 - $141000 (USD) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.  \u003c/p\u003e"],[4],[1789391900,635000000],[1789391900,635000000],[1789391900,980000000],[null,"\u003cp\u003ePlease complete your application before \u003cb\u003eFebruary 26, 2027\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eApplications will be reviewed on a rolling basis and it’s in a candidate’s best interest to apply early.\u003c/p\u003e\u003cp\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about your application, we likely proceeded with other candidates for the role. \u003c/p\u003e\u003cp\u003eParticipation in the internship program requires that you are located in the United States for the duration of the internship program.\u003c/p\u003e\u003cp\u003eThis internship is intended for students who are currently pursuing a PhD degree program \u200b\u200bin Computer Science, HCI, Design or related technical field.\u003c/p\u003e\u003cp\u003eGoogle is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.\u003c/p\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English. Click on the “Apply” button on this page and provide the required materials in the appropriate sections (PDFs preferred):\u003col\u003e\u003cli\u003eIn the “Resume Section:” attach an updated CV or resume.\u003c/li\u003e\u003cul\u003e\u003cli\u003ePlease ensure your resume includes your anticipated graduation date (in MM/YY) and list experience with coding language(s), along with any technical experience or projects.\u003c/li\u003e\u003c/ul\u003e\u003cli\u003eIn the “Education Section:” attach a current or re  regularly in academic journals, release projects as open source, and apply research to Google products.\u003c/p\u003e\u003cp\u003eIndividual pay is determined by factors including job-related skills, experience, and relevant education or training.\u003c/p\u003e\u003cp\u003eUS: $118000 - $157000 (USD) + 0% bonus target\u003c/p\u003e\u003cp\u003eLearn more about \u003ca href\u003d\"https://www.google.com/about/careers/applications/benefits/\" target\u003d\"_blank\"\u003ebenefits at Google\u003c/a\u003e.  \u003c/p\u003e"],[4],[1787555366,460000000],[1788199773,71000000],[1788199773,144000000],[null,"\u003cp\u003eApplications will be reviewed on a rolling basis and it’s in the candidate’s best interest to apply early. The anticipated application window is open until \u003cb\u003eFebruary 26, 2027\u003c/b\u003e, but may close earlier if all available projects are full.\u003c/p\u003e\u003cp\u003eTiming on when you can hear back will vary and can take upwards of 90+ days. If you haven’t heard from us in three months about an application, we likely proceeded with other candidates for that particular role. However, our recruiters might reach out if we find a different potential match for your skills, interests, and experience.\u003c/p\u003e\u003cp\u003eParticipation in the internship program requires that you are located in the United States for the duration of the internship program.\u003c/p\u003e\u003cp\u003eThis internship is intended for students in their penultimate academic year, who are pursuing a PhD degree program in Computer Science or a related field. We also encourage you to apply to our Software Engineering PhD internship, where research-focused projects are available. If you are in an earlier academic year, we encourage you to apply to the Student Researcher opening.\u003c/p\u003e\u003cp\u003eGoogle is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship progra ement.\u003c/p\u003e\u003cp\u003eThis opportunity is intended for students who are pursuing a PhD degree program in Computer Science or a related field. Our Student Researcher opportunities are flexible in time commitment, length of opportunity, and onsite/remote nature, depending on the specific project and host needs. Start dates for this role are typically August through December.\u003c/p\u003e\u003cp\u003eThis program is intended for students who will not be seeking full time employment following this role, as this program is non-conversion eligible.\u003c/p\u003e\u003cp\u003eGoogle is a global company and, in order to facilitate efficient collaboration and communication globally, English proficiency is a requirement for this internship program.\u003c/p\u003e\u003cp\u003eTo start the application process, you will need an updated CV or resume and a current unofficial or official transcript in English (PDFs preferred).\u003c/p\u003e\u003cp\u003e\u003cb\u003ePlease ensure your anticipated graduation dates (in MM/YY) and any proficiency in coding languages are listed on the resume.\u003c/b\u003e\u003c/p\u003e\u003cp\u003eIn accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based Interns. Benefits for this role include: \u003cbr\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHealth, dental, vision insurance\u003c/li\u003e\u003cli\u003eSick Time: 40 hours/year (increased to 69 hours/year for Seattle) including 5 discretionary sick days per instance \u003c/li\u003e\u003cli\u003eHolidays: 13 paid days per year\u003c/li\u003e\u003c/ul\u003e\u003cdiv\u003eApplicants in the County of Los Angeles: Qualified applications with arrest or conviction records will be considered for employment in accordance with the Los Angeles County Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/div\u003e\u003cdiv\u003e\u003cbr\u003e\u003c/div\u003e\u003cdiv\u003eApplicants in San Fra e considered for employment in accordance with the Los Angeles County Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e\u003cp\u003eApplicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.\u003c/p\u003e"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: \u003cb\u003eMountain View, CA, USA; Ann Arbor, MI, USA; Atlanta, GA, USA; Austin, TX, USA; Cambridge, MA, USA; Chicago, IL, USA; Irvine, CA, USA; Kirkland, WA, USA; Los Angeles, CA, USA; Madison, WI, USA; New York, NY, USA; Palo Alto, CA, USA; Princeton, NJ, USA; Pittsburgh, PA, USA; San Bruno, CA, USA; Seattle, WA, USA; San Francisco, CA, USA; Sunnyvale, CA, USA; Washington D.C., DC, USA\u003c/b\u003e."],[null,"\u003cul\u003e\n\u003cli\u003eCurrently enrolled in a Bachelor's or Master’s degree in Computer Science, Linguistics, Statistics, Biostatistics, Applied Mathematics, Operations Research, Economics, Natural Sciences, or a related technical field.\u003c/li\u003e\n\u003cli\u003eExperience in one area of computer science (e.g., Natural Language Understanding, Human Computer Interactions, Computer Vision, Machine Learning, Deep Learning, Algorithmic Foundations of Optimization, Quantum Information Science, Data Science, Software Engineering, or similar areas).\u003cbr\u003e\u003c/li\u003e\n\u003c/ul\u003e"],5],["86533836034187974","Open Sales Career Opportunities, CapitalG Portfolio Companies",null,[null,""],[null,""],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Mountain View, CA, USA",["Google Building 41, 1600 Amphitheatre Pkwy #43, Mountain View, CA 94043, USA"],"Mountain View","94043","CA","US"]],[null,"\u003cp\u0
